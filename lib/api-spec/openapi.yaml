openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Yokai Musubi direct ordering API
servers:
  - url: /api
tags:
  - name: health
  - name: menu
  - name: checkout
  - name: orders
  - name: staff
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /menu:
    get:
      operationId: getMenu
      tags: [menu]
      summary: Get the current menu and fulfillment configuration
      responses:
        "200":
          description: Menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuResponse"
  /checkout/sessions:
    post:
      operationId: createCheckoutSession
      tags: [checkout]
      summary: Validate a cart and create a hosted Stripe Checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /checkout/sessions/{sessionId}:
    get:
      operationId: getCheckoutSession
      tags: [checkout]
      summary: Get payment and order state after returning from Stripe
      security: [{ ConfirmationToken: [] }]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Checkout state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a customer order using its confirmation token
      security: [{ ConfirmationToken: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
  /staff/settings:
    get:
      operationId: getStaffSettings
      tags: [staff]
      summary: Read ordering configuration
      security: [{ StaffKey: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateStaffSettings
      tags: [staff]
      summary: Update ordering configuration
      security: [{ StaffKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfillmentSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /staff/orders:
    get:
      operationId: getStaffOrders
      tags: [staff]
      summary: List orders for staff
      security: [{ StaffKey: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /staff/orders/{orderId}:
    get:
      operationId: getStaffOrder
      tags: [staff]
      summary: Get one staff order
      security: [{ StaffKey: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Staff order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStaffOrder
      tags: [staff]
      summary: Transition an order
      security: [{ StaffKey: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    StaffKey:
      type: apiKey
      in: header
      name: x-staff-key
    ConfirmationToken:
      type: apiKey
      in: header
      name: x-confirmation-token
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string }
    OrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unavailable:
      description: Service unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    ModifierOption:
      type: object
      required: [id, name, priceCents]
      properties:
        id: { type: string }
        name: { type: string }
        priceCents: { type: integer, minimum: 0 }
    ModifierGroup:
      type: object
      required: [id, name, required, options]
      properties:
        id: { type: string }
        name: { type: string }
        required: { type: boolean }
        options:
          type: array
          items: { $ref: "#/components/schemas/ModifierOption" }
    MenuItem:
      type: object
      required: [id, categoryId, name, description, priceCents, currency, available, draft, modifiers]
      properties:
        id: { type: string }
        categoryId: { type: string }
        name: { type: string }
        japaneseName: { type: [string, "null"] }
        description: { type: string }
        imageUrl: { type: [string, "null"] }
        priceCents: { type: integer }
        currency: { type: string }
        available: { type: boolean }
        draft: { type: boolean }
        modifiers:
          type: array
          items: { $ref: "#/components/schemas/ModifierGroup" }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
    DeliveryZone:
      type: object
      required: [zip, name]
      properties:
        zip: { type: string }
        name: { type: string }
    BusinessHour:
      type: object
      required: [day, open, close]
      properties:
        day: { type: integer, minimum: 0, maximum: 6 }
        open: { type: string }
        close: { type: string }
    FulfillmentSettings:
      type: object
      required: [orderingEnabled, pickupEnabled, deliveryEnabled, taxRate, deliveryFeeCents, deliveryMinimumCents, leadTimeMinutes, deliveryZones, hours]
      properties:
        orderingEnabled: { type: boolean }
        pickupEnabled: { type: boolean }
        deliveryEnabled: { type: boolean }
        taxRate: { type: number }
        deliveryFeeCents: { type: integer }
        deliveryMinimumCents: { type: integer }
        leadTimeMinutes: { type: integer }
        deliveryZones:
          type: array
          items: { $ref: "#/components/schemas/DeliveryZone" }
        hours:
          type: array
          items: { $ref: "#/components/schemas/BusinessHour" }
    MenuResponse:
      type: object
      required: [draft, orderingEnabled, categories, items, fulfillment]
      properties:
        draft: { type: boolean }
        orderingEnabled: { type: boolean }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        items:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }
        fulfillment: { $ref: "#/components/schemas/FulfillmentSettings" }
    CheckoutItem:
      type: object
      required: [itemId, quantity]
      properties:
        itemId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
        modifiers:
          type: array
          items:
            type: object
            required: [groupId, optionId]
            properties:
              groupId: { type: string }
              optionId: { type: string }
    Customer:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    Fulfillment:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [pickup, delivery] }
        scheduledFor: { type: [string, "null"], format: date-time }
        address: { type: [string, "null"] }
        city: { type: [string, "null"] }
        state: { type: [string, "null"] }
        zip: { type: [string, "null"] }
    CheckoutInput:
      type: object
      required: [items, customer, fulfillment]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CheckoutItem" }
        customer: { $ref: "#/components/schemas/Customer" }
        fulfillment: { $ref: "#/components/schemas/Fulfillment" }
        notes: { type: [string, "null"] }
    Totals:
      type: object
      required: [subtotalCents, taxCents, deliveryFeeCents, totalCents, currency]
      properties:
        subtotalCents: { type: integer }
        taxCents: { type: integer }
        deliveryFeeCents: { type: integer }
        totalCents: { type: integer }
        currency: { type: string }
    CheckoutSessionResponse:
      type: object
      required: [checkoutSessionId, providerSessionId, confirmationToken, checkoutUrl, totals, fulfillment, expiresAt]
      properties:
        checkoutSessionId: { type: string }
        providerSessionId: { type: string }
        confirmationToken: { type: string }
        checkoutUrl: { type: string, format: uri }
        totals: { $ref: "#/components/schemas/Totals" }
        fulfillment: { $ref: "#/components/schemas/Fulfillment" }
        expiresAt: { type: string, format: date-time }
    CheckoutStatus:
      type: object
      required: [checkoutSessionId, status, totals]
      properties:
        checkoutSessionId: { type: string }
        status: { type: string, enum: [pending, paid] }
        order: { type: [object, "null"] }
        customer: { $ref: "#/components/schemas/Customer" }
        fulfillment: { $ref: "#/components/schemas/Fulfillment" }
        items: { type: array, items: {} }
        totals: { $ref: "#/components/schemas/Totals" }
    Order:
      type: object
      required: [id, orderNumber, customer, fulfillment, items, totals, paymentStatus, status, createdAt]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        customer: { $ref: "#/components/schemas/Customer" }
        fulfillment: { $ref: "#/components/schemas/Fulfillment" }
        notes: { type: [string, "null"] }
        items: { type: array, items: {} }
        totals: { $ref: "#/components/schemas/Totals" }
        paymentStatus: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    StaffOrderList:
      type: object
      required: [orders]
      properties:
        orders: { type: array, items: { $ref: "#/components/schemas/StaffOrder" } }
    StaffOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            id: { type: string }
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, preparing, ready, completed, cancelled] }
        cancellationReason: { type: [string, "null"] }